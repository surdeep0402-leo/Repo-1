<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuthGuard — Secure Authentication</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page-wrapper">
    <!-- Background elements -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <main class="auth-container">
      <!-- Notification Banner -->
      <div id="alertBox" class="alert hidden" role="alert" aria-live="assertive">
        <span class="alert-icon" id="alertIcon"></span>
        <span class="alert-message" id="alertMessage"></span>
        <button type="button" class="alert-close" id="alertCloseBtn" aria-label="Dismiss alert">&times;</button>
      </div>

      <!-- Auth Card (Sign In / Sign Up) -->
      <div id="authCard" class="auth-card">
        <header class="card-header">
          <div class="brand-badge">
            <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>AuthGuard</span>
          </div>
          <h1 class="card-title" id="cardTitle">Welcome back</h1>
          <p class="card-subtitle" id="cardSubtitle">Please enter your credentials to log in.</p>
        </header>

        <!-- Segmented Tab Switcher -->
        <nav class="tabs-nav" aria-label="Authentication Options">
          <button type="button" class="tab-btn active" id="tabLogin" aria-selected="true" role="tab">
            Sign In
          </button>
          <button type="button" class="tab-btn" id="tabRegister" aria-selected="false" role="tab">
            Create Account
          </button>
        </nav>

        <!-- SIGN IN FORM -->
        <form id="loginForm" class="auth-form" novalidate>
          <div class="form-group">
            <label for="loginIdentifier">Username or Email</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input
                type="text"
                id="loginIdentifier"
                name="identifier"
                placeholder="e.g. alex or alex@example.com"
                autocomplete="username"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="loginPassword">Password</label>
            </div>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input
                type="password"
                id="loginPassword"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
              <button type="button" class="toggle-password" aria-label="Toggle password visibility" data-target="loginPassword">
                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-closed hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="loginSubmitBtn">
            <span class="btn-text">Sign In</span>
            <div class="spinner hidden" id="loginSpinner"></div>
          </button>
        </form>

        <!-- SIGN UP / REGISTRATION FORM -->
        <form id="registerForm" class="auth-form hidden" novalidate>
          <div class="form-group">
            <label for="regUsername">Username</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input
                type="text"
                id="regUsername"
                name="username"
                placeholder="Choose a username (min 3 chars)"
                autocomplete="username"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="regEmail">Email Address</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              <input
                type="email"
                id="regEmail"
                name="email"
                placeholder="you@domain.com"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="regPassword">Password</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input
                type="password"
                id="regPassword"
                name="password"
                placeholder="At least 6 characters"
                autocomplete="new-password"
                required
              />
              <button type="button" class="toggle-password" aria-label="Toggle password visibility" data-target="regPassword">
                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-closed hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="regConfirmPassword">Confirm Password</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input
                type="password"
                id="regConfirmPassword"
                name="confirmPassword"
                placeholder="Re-type your password"
                autocomplete="new-password"
                required
              />
            </div>
          </div>

          <button type="submit" class="submit-btn" id="regSubmitBtn">
            <span class="btn-text">Create Account</span>
            <div class="spinner hidden" id="regSpinner"></div>
          </button>
        </form>

        <footer class="card-footer">
          <p id="footerText">Don't have an account? <a href="#" id="switchLink">Sign Up</a></p>
        </footer>
      </div>

      <!-- DASHBOARD CARD (Visible when authenticated) -->
      <div id="dashboardCard" class="auth-card dashboard-card hidden">
        <header class="card-header text-center">
          <div class="avatar-badge" id="userAvatarBadge">U</div>
          <h1 class="card-title">Welcome, <span id="dashUsername">User</span>!</h1>
          <p class="card-subtitle">You have successfully authenticated via MongoDB & JWT.</p>
        </header>

        <div class="profile-details">
          <div class="detail-item">
            <span class="detail-label">Username</span>
            <span class="detail-value" id="dashValUsername">-</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Email Address</span>
            <span class="detail-value" id="dashValEmail">-</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Account ID</span>
            <span class="detail-value code" id="dashValId">-</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Joined On</span>
            <span class="detail-value" id="dashValJoined">-</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Session Status</span>
            <span class="detail-value status-active">
              <span class="status-dot"></span> Active (JWT Protected)
            </span>
          </div>
        </div>

        <button type="button" class="btn-secondary" id="logoutBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Sign Out
        </button>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
